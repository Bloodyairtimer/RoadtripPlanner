name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore RoadtripPlanner.slnx
      - run: dotnet build RoadtripPlanner.slnx --no-restore --configuration Release
      - run: dotnet test RoadtripPlanner.slnx --no-build --configuration Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/RoadtripPlanner/wwwroot/app.js
      - run: node --test tests/frontend/*.test.mjs
  browser:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build src/RoadtripPlanner/RoadtripPlanner.csproj -c Release
      - run: npm ci --prefix tests/browser
      - run: tests/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: npm test --prefix tests/browser
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            TestResults/*.png
            tests/browser/test-results
  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: roadtrip-planner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container and persistence
        shell: bash
        run: |
          set -euo pipefail
          docker volume create test-trips
          docker run -d --name planner -p 127.0.0.1:8088:8080 -v test-trips:/data roadtrip-planner:test
          trap 'docker logs planner' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8088/health; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8088/health
          curl --fail http://localhost:8088/ | grep -q 'Roadtrip planner'
          curl --fail -H 'Content-Type: application/json' -d '{"name":"Container smoke test","stops":[],"notes":""}' http://localhost:8088/api/trips
          docker restart planner
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8088/health; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8088/api/trips | grep -q 'Container smoke test'
